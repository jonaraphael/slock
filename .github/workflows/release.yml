name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable version tag to release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Validate release version
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import plistlib
          import re

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag):
              raise SystemExit("Release tags must use vMAJOR.MINOR.PATCH (stable releases only).")
          version = tag[1:]
          info = plistlib.loads(pathlib.Path("Resources/Info.plist").read_bytes())
          source_versions = re.findall(r'static let appVersion = "([^"]+)"', pathlib.Path("slock.swift").read_text())
          if info["CFBundleShortVersionString"] != version or source_versions != [version]:
              raise SystemExit(f"Tag {tag} must match both Info.plist and SlockConfig.appVersion.")
          print(f"Validated {tag}")
          PY

      - name: Run regression tests
        run: ./test.command

      - name: Build universal app
        env:
          CAPSLINK_ARCHS: arm64 x86_64
        run: ./build.command

      - name: Verify release bundle
        run: |
          app=dist/slock.app
          /usr/bin/codesign --verify --strict "$app"
          xcrun lipo "$app/Contents/MacOS/slock" -verify_arch arm64 x86_64
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")
          [[ "v$version" == "$RELEASE_TAG" ]]
          icon=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIconFile' "$app/Contents/Info.plist")
          [[ "$icon" == "AppIcon.icns" ]]
          [[ -s "$app/Contents/Resources/$icon" ]]
          for architecture in arm64 x86_64; do
            minimum=$(/usr/bin/otool -arch "$architecture" -l "$app/Contents/MacOS/slock" | awk '$1 == "minos" { print $2 }')
            [[ "$minimum" == "13.0" ]]
          done
          /usr/bin/unzip -tq dist/slock.app.zip
          /usr/bin/unzip -p dist/slock.app.zip "slock.app/Contents/Resources/$icon" | cmp - "$app/Contents/Resources/$icon"
          cd dist
          shasum -a 256 slock.app.zip > SHA256SUMS

      - name: Prepare GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          state=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [[ "$state" == "false" ]]; then
            echo "Release $RELEASE_TAG is already published; leaving its assets unchanged."
            exit 0
          fi
          if [[ "$state" != "true" ]]; then
            notes=(--generate-notes)
            if [[ -f "docs/releases/$RELEASE_TAG.md" ]]; then
              notes=(--notes-file "docs/releases/$RELEASE_TAG.md")
            fi
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "slock $RELEASE_TAG" "${notes[@]}"
          fi
          # Only drafts reach this upload, so a failed upload cannot break the
          # current download. A rerun can finish an interrupted draft release.
          gh release upload "$RELEASE_TAG" dist/slock.app.zip dist/SHA256SUMS --clobber
          if [[ -f scripts/sign-update.command ]]; then
            echo "Draft ready. Complete local signing and publication with ./scripts/publish-release.command $RELEASE_TAG"
            gh release view "$RELEASE_TAG" --json url --jq .url
            exit 0
          fi
          # REST lookup by tag excludes drafts; the CLI also searches drafts.
          release_id=$(gh release view "$RELEASE_TAG" --json databaseId --jq .databaseId)
          gh api --method PATCH "repos/$GH_REPO/releases/$release_id" \
            -F draft=false -f make_latest=legacy --silent
          gh release view "$RELEASE_TAG" --json url --jq .url
